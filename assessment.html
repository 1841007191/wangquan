<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考核费缴纳 - 忘权俱乐部</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* 导航栏 */
        nav {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }
        
        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }
        
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }
        
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        /* 页面标题 */
        .page-header {
            text-align: center;
            padding: 4rem 0;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0zNiAxOGMzLjMxNCAwIDYtMi42ODYgNi02cy0yLjY4Ni02LTYtNmMtMy4zMTQgMC02IDIuNjg2LTYgNnMyLjY4NiA2IDYgNnptMCAzMGMzLjMxNCAwIDYtMi42ODYgNi02cy0yLjY4Ni02LTYtNmMtMy4zMTQgMC02IDIuNjg2LTYgNnMyLjY4NiA2IDYgNnptLTE4IDBjMy4zMTQgMCA2LTIuNjg2IDYtNnMtMi42ODYtNi02LTZjLTMuMzE0IDAtNiAyLjY4Ni02IDZzMi42ODYgNiA2IDZ6IiBzdHJva2U9IiMzMzQxNTUiIHN0cm9rZS13aWR0aD0iMiIvPjwvZz48L3N2Zz4=');
        }
        
        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--accent-color), #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* 内容区域 */
        .content-section {
            padding: 4rem 0;
            text-align: center;
        }
        
        .payment-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            margin: 2rem auto;
            display: block;
        }
        
        .payment-info {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background-color: var(--secondary-color);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        
        .payment-info h3 {
            color: var(--accent-color);
            margin-bottom: 1rem;
        }
        
        .payment-info p {
            margin-bottom: 1rem;
            line-height: 1.8;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .back-link:hover {
            background-color: #2563eb;
        }
        
        /* 页脚 */
        footer {
            background-color: var(--secondary-color);
            padding: 2rem 0;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--secondary-color);
                padding: 1rem 0;
                border-bottom: 1px solid var(--border-color);
            }
            
            .nav-links.active {
                display: flex;
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .page-header h1 {
                font-size: 2.5rem;
            }
            
            .payment-image {
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <div class="container nav-container">
            <div class="nav-logo">忘权俱乐部</div>
            <button class="mobile-menu-btn">☰</button>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="join.html" class="active">打手入驻</a>
            </div>
        </div>
    </nav>
    
    <!-- 页面标题 -->
    <section class="page-header">
        <div class="container">
            <h1>考核费缴纳</h1>
            <p>申请入驻前，请先缴纳考核费并参加技能考核</p>
        </div>
    </section>
    
    <!-- 内容区域 -->
    <section class="content-section">
        <div class="container">
            <div class="payment-info">
                <h3>考核费说明</h3>
                <p>所有申请者需缴纳考核费，用于验证游戏技能和服务态度。</p>
                <p>考核费金额：请联系客服确认具体金额</p>
                <p>缴纳方式：扫描下方二维码进行支付</p>
            </div>
            
            <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/58419925325643fb816cca0c37590e4c.jpg~tplv-a9rns2rl98-24:720:720.jpg?lk3s=8e244e95&rcl=2026050623074498E2746243789DF49830&rrcfp=8a172a1a&x-expires=1778684864&x-signature=248eKxS%2FqseZtnasNB3Iwhw%2FwIs%3D" alt="考核费收款码" class="payment-image">
            
            <div class="payment-info">
                <h3>考核流程</h3>
                <p>1. 支付考核费后，联系客服预约考核时间</p>
                <p>2. 按照约定时间参加游戏技能考核</p>
                <p>3. 考核通过后，将收到下一步入驻指引</p>
            </div>
            
            <a href="join.html" class="back-link">返回打手入驻</a>
        </div>
    </section>
    
    <!-- 页脚 -->
    <footer>
        <div class="container">
            <p>&copy; 2026 忘权俱乐部. 保留所有权利.</p>
        </div>
    </footer>
    
    <script>
        // 移动端菜单切换
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.querySelector('.nav-links');
        
        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
        
        // 导航链接激活状态
        const links = document.querySelectorAll('.nav-links a');
        const currentUrl = window.location.href;
        
        links.forEach(link => {
            if (link.href === currentUrl) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
